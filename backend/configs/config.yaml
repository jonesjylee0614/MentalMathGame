# Mental Math Game Backend Configuration

server:
  host: 0.0.0.0
  port: "8080"
  mode: debug # debug, release, test
  allow_origins:
    - http://localhost:5173
    - http://localhost:3000
    - "*"

database:
  host: localhost
  port: 3306
  username: root
  password: Jz@szM982io
  database: mental_math_game
  charset: utf8mb4
  parse_time: true
  loc: Local
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600 # seconds

redis:
  host: localhost
  port: 6379
  password: "!QAZ2wsx"
  db: 0
  pool_size: 10

jwt:
  secret: your-secret-key-please-change-in-production-environment
  expire_hours: 168 # 7 days
  issuer: mental-math-game

cors:
  allowed_origins:
    - http://localhost:5173
    - http://localhost:3000
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed_headers:
    - Authorization
    - Content-Type
    - Accept
  expose_headers:
    - Content-Length
  max_age: 43200 # 12 hours

rate_limit:
  login: 5 # 5 requests per minute
  register: 3 # 3 requests per hour
  game_submit: 100 # 100 requests per hour
  query: 1000 # 1000 requests per hour

log:
  level: debug # debug, info, warn, error
  filename: logs/app.log
  max_size: 100 # MB
  max_age: 30 # days
  max_backups: 10
  compress: false

